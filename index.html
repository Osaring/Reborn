<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Reborn</title>
<meta name="apple-mobile-web-app-title" content="Reborn">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef0f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12131c" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Layout : écran d'appli fixe — en-tête + anneaux de stats en haut, zone centrale qui défile seule, bouton « +1 an » et barre d'onglets en bas. Rien ne déborde de l'écran. */
:root{
  --bg:#eef0f7; --surf:#ffffff; --surf2:#e5e8f3; --line:#dde0ec;
  --fg:#161827; --muted:#6b7088; --accent:#ff5a36; --on-accent:#ffffff;
  --bon:#f5a300; --san:#17b26a; --int:#3478f6; --cha:#e8458f; --mon:#0f9f8f; --neg:#e5484d;
  --font-d:'Bricolage Grotesque',system-ui,sans-serif; --font-b:'Figtree',system-ui,-apple-system,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131c; --surf:#1c1e2b; --surf2:#272a3a; --line:#2f3245;
  --fg:#f2f3f8; --muted:#9196ae; --accent:#ff6b4a; --on-accent:#1a0a05;
  --bon:#ffc23d; --san:#3ed28a; --int:#6ea4ff; --cha:#ff74b0; --mon:#3cd0bd; --neg:#ff6b6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131c; --surf:#1c1e2b; --surf2:#272a3a; --line:#2f3245;
  --fg:#f2f3f8; --muted:#9196ae; --accent:#ff6b4a; --on-accent:#1a0a05;
  --bon:#ffc23d; --san:#3ed28a; --int:#6ea4ff; --cha:#ff74b0; --mon:#3cd0bd; --neg:#ff6b6f; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg)}
body{font-family:var(--font-b);font-size:14px;line-height:1.35;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{-webkit-user-select:text;user-select:text}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#app{height:100%;max-width:520px;margin:0 auto}
.screen{height:100%;display:flex;flex-direction:column}
.main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:6px 10px;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}

/* En-tête */
.hd{display:flex;align-items:center;gap:10px;padding-top:8px}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:16px;background:var(--fg);color:var(--bg);flex-shrink:0}
.who{flex:1;min-width:0}
.nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agebx{text-align:right;line-height:.9}
.age{font-family:var(--font-d);font-weight:800;font-size:34px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.agel{font-size:11px;color:var(--muted);font-weight:700}
.icb{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surf);color:var(--muted)}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.ring{position:relative;display:grid;justify-items:center;gap:2px}
.ring .r{position:relative;width:52px;height:52px;display:grid;place-items:center;color:var(--c)}
.ring svg.g{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--surf2);stroke-width:5}
.ring .pr{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round;transition:stroke-dasharray .6s ease}
.ring b{font-size:12px;font-variant-numeric:tabular-nums}
.ring.low b{color:var(--neg)}
.strip{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:8px 12px;background:var(--surf);border-radius:14px}
.money{display:flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mon)}
.money.neg{color:var(--neg)}
.nrg{display:flex;gap:2px;color:var(--accent)}
.nrg .i{width:18px;height:18px}
.nrg .off{color:var(--surf2)}

/* Dock et onglets */
.dock{display:flex;gap:8px;padding-top:8px}
.objc{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:16px;background:var(--surf);font-size:12px;font-weight:600;text-align:left}
.objc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.objc .i{color:var(--muted)}
.objc.ok .i{color:var(--san)}
.year{height:52px;padding:0 22px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-family:var(--font-d);font-weight:800;font-size:19px;letter-spacing:-.01em;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .1s}
.year:active{transform:scale(.96)}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);padding-block:8px 4px}
.tabbar button{display:grid;justify-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--muted);padding:4px 0}
.tabbar button.on{color:var(--fg)}
.tabbar .dot{width:4px;height:4px;border-radius:50%;background:transparent}
.tabbar button.on .dot{background:var(--accent)}

/* Journal */
.yr{display:grid;grid-template-columns:38px 1fr;gap:8px;margin-bottom:10px}
.yb{font-family:var(--font-d);font-weight:800;font-size:15px;text-align:center;padding-top:8px;color:var(--muted);font-variant-numeric:tabular-nums}
.yr.now .yb{color:var(--accent)}
.ys{display:grid;gap:6px;min-width:0}
.en{display:flex;gap:10px;align-items:flex-start;background:var(--surf);border-radius:14px;padding:10px 12px}
.yr:not(.now) .en{background:transparent;padding:4px 0}
.eb{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surf2);font-size:16px;flex-shrink:0}
.yr:not(.now) .eb{width:24px;height:24px;font-size:13px;border-radius:8px}
.et{min-width:0;display:grid;gap:4px}
.yr:not(.now) .et{color:var(--muted);font-size:13px}
.dls{display:flex;gap:4px;flex-wrap:wrap}
.dl{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 7px 2px 5px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);font-variant-numeric:tabular-nums}
.dl .i{width:12px;height:12px;stroke-width:2.5}
.dl.neg{color:var(--neg);background:color-mix(in srgb,var(--neg) 12%,transparent)}

/* Tuiles d'activité */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:grid;justify-items:center;gap:6px;padding:12px 4px 10px;border-radius:18px;background:var(--surf);min-width:0;transition:transform .1s}
.tile:active{transform:scale(.95)}
.tile .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.tile .ic .i{width:22px;height:22px}
.tile .l{font-weight:700;font-size:12.5px}
.tile .c{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:-4px;font-variant-numeric:tabular-nums}
.tile[disabled]{opacity:.35;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 10px}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;color:var(--muted);padding:40px 20px}
.empty .i{width:36px;height:36px}

/* Cartes */
.card{background:var(--surf);border-radius:20px;padding:14px;display:grid;gap:10px;margin-bottom:10px}
.ch{display:flex;align-items:center;gap:12px}
.ch .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);flex-shrink:0}
.ch .tt{font-family:var(--font-d);font-weight:800;font-size:17px;line-height:1.1}
.ch .sb{font-size:12px;color:var(--muted);margin-top:2px}
.bign{font-family:var(--font-d);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar{height:8px;border-radius:9px;background:var(--surf2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c,var(--accent));transition:width .5s}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.pb{display:inline-flex;align-items:center;gap:5px;padding:8px 11px;border-radius:12px;background:var(--surf2);font-size:12.5px;font-weight:700}
.pb .i{width:15px;height:15px}
.pb[disabled]{opacity:.35;cursor:not-allowed}
.pb.warn{color:var(--neg)}
.pb.go{background:var(--accent);color:var(--on-accent)}
.sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:14px 2px 8px}
.rows{background:var(--surf);border-radius:20px;overflow:hidden}
.rw{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:0}
.rw .x{flex:1;min-width:0}
.rw .x b{display:block;font-size:14px}
.rw .x small{color:var(--muted);font-size:11.5px}
.rw .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mon)}
.rw[disabled]{cursor:default}
.rw[disabled] .x b,.rw[disabled] .v{opacity:.4}
.rw .lk{color:var(--muted)}

/* Proches */
.pp{display:grid;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pp:last-child{border-bottom:0}
.ph{display:flex;align-items:center;gap:10px}
.pa{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--c);flex-shrink:0}
.ph .x{flex:1;min-width:0}
.ph .x b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .x small{color:var(--muted);font-size:12px}
.hb{display:flex;align-items:center;gap:4px;color:var(--cha);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.hb .i{width:14px;height:14px;fill:currentColor}
.pp.dead{opacity:.45}

/* Défis */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{display:grid;justify-items:center;gap:6px;padding:12px 4px;border-radius:18px;background:var(--surf);text-align:center;min-width:0}
.bdg .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surf2);color:var(--muted)}
.bdg.got .ic{background:color-mix(in srgb,var(--bon) 20%,transparent);color:var(--bon)}
.bdg .l{font-size:11.5px;font-weight:700;line-height:1.15}
.bdg.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.stars{display:flex;gap:8px}
.stars>div{flex:1;background:var(--surf);border-radius:16px;padding:10px 12px}
.stars b{font-family:var(--font-d);font-size:22px;font-weight:800;display:block;font-variant-numeric:tabular-nums}
.stars small{color:var(--muted);font-size:11px;font-weight:600}

/* Accueil */
.brand{padding-top:18px;display:flex;justify-content:space-between;align-items:flex-end}
.brand h1{margin:0;font-family:var(--font-d);font-weight:800;font-size:46px;letter-spacing:-.04em;line-height:.9}
.brand h1 span{color:var(--accent)}
.brand .stars>div{padding:6px 10px}
.brand .stars b{font-size:18px}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;background:var(--surf);border:0;border-radius:14px;padding:12px;font:inherit;font-weight:600;color:var(--fg)}
.seg{display:flex;background:var(--surf);border-radius:14px;padding:3px;gap:3px;margin-top:8px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg)}
.chs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chs .bdg.on{box-shadow:inset 0 0 0 2px var(--accent)}
.chd{font-size:12.5px;color:var(--muted);text-align:center;padding:8px 6px 0}
.perks{display:flex;gap:6px;flex-wrap:wrap}
.perk{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:999px;background:var(--surf);font-weight:700;font-size:12.5px}
.perk em{font-style:normal;color:var(--accent)}
.perk.on{background:var(--fg);color:var(--bg)}
.perk[disabled]{opacity:.35}
.go{width:100%;height:54px;border-radius:18px;background:var(--accent);color:var(--on-accent);font-family:var(--font-d);font-weight:800;font-size:19px;margin-block:8px 6px}

/* Modale */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,11,20,.5);display:flex;align-items:flex-end;justify-content:center;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:500px;max-height:86%;overflow:auto;background:var(--surf);border-radius:28px;padding:22px 18px 18px;display:grid;gap:14px;animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.eh{display:flex;align-items:center;gap:12px}
.ei{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:var(--surf2);flex-shrink:0}
.eh .ag{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.eh h3{margin:2px 0 0;font-family:var(--font-d);font-weight:800;font-size:20px;line-height:1.1;text-wrap:balance}
.sheet p{margin:0;font-size:16px;line-height:1.4}
.cbs{display:grid;gap:8px}
.cb{text-align:left;padding:15px 16px;border-radius:16px;background:var(--surf2);font-weight:700;font-size:15px;transition:transform .1s}
.cb:active{transform:scale(.98)}
.sheet .dls{gap:6px}
.sheet .dl{font-size:13px;padding:4px 10px 4px 8px}
.sheet .dl .i{width:14px;height:14px}
.next{height:52px;border-radius:16px;background:var(--fg);color:var(--bg);font-weight:800;font-size:16px}
.score{font-family:var(--font-d);font-weight:800;font-size:64px;line-height:.9;color:var(--accent);letter-spacing:-.04em}
.sumg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sumg>div{background:var(--surf2);border-radius:14px;padding:10px 12px}
.sumg b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.sumg small{color:var(--muted);font-size:11px;font-weight:600}
.toasts{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;z-index:60;display:grid;justify-items:center;gap:6px;pointer-events:none;padding-inline:14px}
.toast{display:grid;gap:5px;background:var(--fg);color:var(--bg);border-radius:16px;padding:10px 14px;font-size:13px;font-weight:600;max-width:400px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .22s ease}
.toast .dl{background:color-mix(in srgb,var(--bg) 14%,transparent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){.ring .r{width:44px;height:44px}.age{font-size:28px}.year{height:46px}}
</style>
</head>
<body>
<div id="app">
  <section id="start" class="screen" hidden></section>
  <section id="game" class="screen" hidden>
    <header class="hd">
      <div class="av" id="g-av"></div>
      <div class="who"><div class="nm" id="g-name"></div><div class="st" id="g-sub"></div></div>
      <div class="agebx"><div class="age" id="g-age"></div><div class="agel" id="g-agel">ans</div></div>
      <button class="icb" id="g-menu" aria-label="Options"></button>
    </header>
    <div class="rings" id="g-stats"></div>
    <div class="strip"><span class="money" id="g-money"></span><span class="nrg" id="g-nrg" aria-label="Énergie"></span></div>
    <main class="main" id="panel"></main>
    <div class="dock" id="dock"><button class="objc" id="d-obj"></button><button class="year" id="d-year">+1 an</button></div>
    <nav class="tabbar" id="g-tabs"></nav>
  </section>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toasts" id="toasts"></div>
<script>

const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const fmt=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('fr-FR')+' €';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const PM=['Lucas','Hugo','Léo','Gabriel','Louis','Arthur','Jules','Adam','Nathan','Raphaël','Tom','Noah','Théo','Ethan','Malo','Sacha','Yanis','Enzo','Maxime','Antoine','Samuel','Mehdi','Karim','Paul','Victor','Baptiste','Valentin','Bastien'];
const PF=['Emma','Jade','Louise','Alice','Chloé','Léa','Manon','Inès','Lina','Camille','Sarah','Zoé','Juliette','Nina','Rose','Anna','Léna','Mila','Clara','Yasmine','Lou','Margaux','Aïcha','Elsa','Romane'];
const NOMS=['Martin','Bernard','Dubois','Thomas','Robert','Richard','Petit','Durand','Leroy','Moreau','Simon','Laurent','Lefebvre','Michel','Garcia','David','Roux','Vincent','Fournier','Morel','Girard','Bonnet','Dupont','Lambert','Fontaine','Rousseau','Benali','Nguyen','Da Silva','Kaya'];
const VILLES=['Paris','Lyon','Marseille','Lille','Bordeaux','Nantes','Toulouse','Strasbourg','Rennes','Nice','Montpellier','Brest','Grenoble','Dijon'];

let S=null;
let M={stars:0,lives:0,trophies:{},best:0};
let TAB='journal', CUR=[], CONFIRM=null;
const KEY='destinees_v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,M}))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}

const STATS={bonheur:{n:'Bonheur',c:'var(--bon)'},sante:{n:'Santé',c:'var(--san)'},intel:{n:'Intelligence',c:'var(--int)'},charme:{n:'Charme',c:'var(--cha)'}};
const g=(m,f)=>S&&S.sex==='f'?f:m;
const chance=p=>Math.random()<p+(S?S.luck:0);

function fx(o){
  for(const k in o){const v=Math.round(o[k]);if(!v)continue;
    if(k==='money'){S.money+=v;CUR.push([k,v]);}
    else if(STATS[k]){const b=S.stats[k];S.stats[k]=clamp(b+v);const d=S.stats[k]-b;if(d)CUR.push([k,d]);}
  }
}
function log(t,d=[]){S.log.push({a:S.age,t,d:d.slice()});if(S.log.length>400)S.log.shift();}

/* ---------- Personnes ---------- */
function rname(sx){return sx==='f'?pick(PF):pick(PM);}
let RID=1;
function person(type,sx,age,rel,last){return {id:'p'+Date.now().toString(36)+(RID++),type,sx,name:rname(sx)+' '+(last||pick(NOMS)),age,rel,alive:true};}
function partner(){return S.rel.find(r=>r.alive&&!r.ex&&(r.type==='partenaire'||r.type==='conjoint'));}
function friends(){return S.rel.filter(r=>r.alive&&r.type==='ami');}
function parents(){return S.rel.filter(r=>r.alive&&(r.type==='mère'||r.type==='père'));}
function relLabel(r){
  const f=r.sx==='f';
  return {mère:'Mère',père:'Père',fratrie:f?'Sœur':'Frère',ami:f?'Amie':'Ami',partenaire:f?'Copine':'Copain',conjoint:f?'Épouse':'Époux',enfant:f?'Fille':'Fils'}[r.type]||r.type;
}

/* ---------- Cycle de vie ---------- */
function newLife(o){
  const st={bonheur:R(55,80),sante:R(62,90),intel:R(25,68),charme:R(25,68)};
  S={first:o.first,last:o.last,sex:o.sex,attr:o.attr,city:pick(VILLES),age:0,alive:true,stats:st,money:0,energy:0,
    job:null,retired:false,pension:0,edu:0,school:'crèche',study:null,rel:[],log:[],queue:[],won:[],starsEarned:0,
    challenge:o.challenge,perks:o.perks,luck:o.perks.includes('lucky')?.08:0,
    flags:{trips:0,everWorked:false,married:false,kids:0,pet:null},yr:{},talked:{},applied:{},obj:null,yrStartMoney:0};
  if(o.perks.includes('genius'))st.intel=clamp(st.intel+25);
  if(o.perks.includes('charm'))st.charme=clamp(st.charme+25);
  if(o.perks.includes('iron'))st.sante=clamp(st.sante+15);
  const mom=person('mère','f',R(24,38),R(70,90),S.last), dad=person('père','m',R(25,40),R(65,90),S.last);
  S.rel.push(mom,dad);
  if(Math.random()<.5){const s=person('fratrie',pick(['m','f']),R(2,8),R(50,75),S.last);S.rel.push(s);}
  log(`Tu es né${g('','e')} à ${S.city}. Tes parents s’appellent ${first(mom)} et ${first(dad)}.`);
  const ch=trophyById(S.challenge);
  if(ch)log(`🎯 Défi de cette vie : ${ch.t} — ${ch.d}.`);
  newYear();
}
function newYear(){
  const a=S.age;
  S.energy=a<3?0:a<6?2:4;
  S.yr={sport:0,etude:0,lire:0,fete:0,social:0,bosse:0,medit:0};
  S.yrStartMoney=S.money;S.talked={};S.applied={};CONFIRM=null;
  const pool=OBJ.filter(o=>a>=o.min&&(!o.cond||o.cond()));
  S.obj=a>=3&&pool.length?pick(pool).id:null;
}
function pickEvents(){
  const el=Object.values(EV).filter(e=>e.p>0&&S.age>=e.min&&S.age<=e.max&&!(e.once&&S.flags['ev_'+e.id])&&(!e.cond||e.cond()));
  el.sort(()=>Math.random()-.5);
  const out=[];
  for(const e of el){if(out.length>=2)break;if(Math.random()<e.p){out.push(e.id);if(e.once)S.flags['ev_'+e.id]=true;}}
  return out;
}

function ageUp(){
  if(!S||!S.alive)return;
  const msgs=[];
  // objectif
  const ob=OBJ.find(o=>o.id===S.obj);
  if(ob&&ob.ok()){CUR=[];M.stars++;S.starsEarned++;fx({bonheur:2});log(`🎯 Objectif réussi : ${ob.t} (+1 ★)`,CUR);toast('Objectif réussi ! +1 ★',CUR);}
  S.age++;const a=S.age;
  CUR=[];
  // vieillissement
  let dec=a>=80?R(2,4):a>=65?R(1,3):a>=45?R(0,2):0;if(S.perks.includes('iron'))dec=Math.floor(dec/2);
  if(dec)fx({sante:-dec});
  if(a>=18&&S.stats.bonheur<50&&partner()&&partner().rel>60)fx({bonheur:2});
  const ageD=CUR.slice();
  log(a===1?'Tu as 1 an. Tu fais tes premiers pas.':`Tu as ${a} ans.`,ageD);
  // proches
  S.rel.forEach(r=>{
    if(!r.alive||r.ex)return;r.age++;r.rel=clamp(r.rel-R(1,4));
    if(r.type!=='enfant'&&r.age>68&&Math.random()<((r.age-62)/42)**3){
      r.alive=false;r.deadAt=r.age;CUR=[];fx({bonheur:-R(7,14)});let t=`${relLabel(r)} — ${first(r)} est décédé${r.sx==='f'?'e':''} à ${r.age} ans.`;
      if((r.type==='mère'||r.type==='père')&&a>=18){const h=S.perks.includes('rich')?R(40000,150000):R(0,25000);if(h){fx({money:h});t+=` Tu hérites de ${fmt(h)}.`;}}
      if(r.type==='conjoint'||r.type==='partenaire')S.flags.cohab=false;
      log('🕯️ '+t,CUR);
    }else if(r.type==='ami'&&r.rel<=5){r.alive=false;r.lost=true;log(`Tu as perdu de vue ${first(r)}.`);}
    if(r.type==='enfant'&&r.age===18)log(`🎒 ${first(r)} quitte la maison pour faire sa vie.`);
  });
  const p=partner();if(p&&p.rel<12&&chance(.5)){CUR=[];log('💔 '+breakUp(p,`${first(p)} te quitte. Vous ne vous parliez plus.`),CUR);}
  // école
  if(a===3)S.school='maternelle';
  if(a===6){S.school='primaire';log('🎒 Ta première rentrée à l’école primaire.');}
  if(a===11){S.school='collège';log('🎒 Tu entres au collège.');}
  if(a===15){S.school='lycée';log('🎒 Tu entres au lycée.');}
  if(a===18&&S.edu===0)S.queue.push('bac');
  if(a===19&&S.flags.redouble){S.flags.redouble=false;S.queue.push('bac');}
  if(a===18&&S.perks.includes('rich')){CUR=[];fx({money:40000});log('💰 Tes parents te versent 40 000 € pour tes 18 ans.',CUR);}
  if(a===18&&S.school&&S.edu===0&&!S.queue.includes('bac'))S.school=null;
  // études
  if(S.study){S.study.left--;if(S.study.left<=0){const st=STUDY[S.study.type];S.edu=st.edu;S.study=null;CUR=[];fx({bonheur:8,intel:3});log(`🎓 Diplôme obtenu : ${EDU[S.edu]} !`,CUR);
    if(st.edu===2)S.queue.push('suitelicence');if(st.edu===3)S.queue.push('suitemaster');}}
  // travail
  let inc=0;
  if(S.job){const j=S.job,d=jd(j.id);j.years++;j.yearsLv++;
    j.perf=clamp(j.perf+R(-6,4)+(S.stats.intel>60?2:0));
    if(d.random){j.lastInc=Math.round((S.stats.charme**2)*R(1,8)*LVM[j.level]*(chance(.1)?6:1));inc=Math.round(j.lastInc*.7);}
    else inc=Math.round(salary()*.77);
    if(j.level<4&&j.yearsLv>=2&&j.perf>=62&&chance(.4+(j.perf-62)/90)){j.level++;j.yearsLv=0;j.perf=55;CUR=[];fx({bonheur:6});log(`🎉 Promotion ! Te voilà ${jobTitle(j)}.`,CUR);}
    else if(j.perf<18&&chance(.5)){CUR=[];fx({bonheur:-8});log(`📦 Tu es licencié${g('','e')} de ton poste de ${jobTitle(j)}.`,CUR);S.job=null;}
  }
  if(S.job&&a>=64){S.pension=Math.round(salary()*.6*.77);S.retired=true;CUR=[];fx({bonheur:6});log(`🌴 Tu prends ta retraite après ta carrière de ${jobTitle(S.job)}.`,CUR);S.job=null;}
  // argent
  if(a>=19){
    if(!S.job){if(S.retired)inc=S.pension;else if(!S.study)inc=7000;else inc=6500;}
    let exp=S.study?6500:(S.flags.cohab?10000:14000);
    exp+=S.rel.filter(r=>r.type==='enfant'&&r.alive&&r.age<18).length*4000;
    CUR=[];fx({money:inc-exp});
    if(S.money<0)fx({bonheur:-3});
    log(`💶 Bilan de l’année : +${fmt(inc)} de revenus, −${fmt(exp)} de dépenses.`,CUR);
  }
  // mort
  if(checkDeath())return;
  newYear();
  S.queue.push(...pickEvents());
  checkTrophies();save();render();runQueue();
}
function checkDeath(){
  if(!S.alive)return true;
  if(S.stats.sante<=0){die('Ta santé a fini par lâcher.');return true;}
  const a=S.age;
  if(a>=60){const pr=((a-60)/48)**3*(1.5-S.stats.sante/100);if(Math.random()<pr){die(a>=80?'Tu t’es éteint'+g('','e')+' paisiblement dans ton sommeil.':'Une maladie t’a emporté'+g('','e')+'.');return true;}}
  if(a>=18&&Math.random()<.0015){die('Un accident tragique et inattendu.');return true;}
  return false;
}
function score(){const s=S.stats;return Math.round(S.age*2+(s.bonheur+s.sante+s.intel+s.charme)/4+Math.max(0,S.money)/20000+S.won.length*50+S.flags.kids*10);}
function die(cause){
  checkTrophies();
  S.alive=false;S.cause=cause;S.score=score();S.queue=[];
  M.lives++;if(S.score>M.best)M.best=S.score;
  log('⚰️ '+cause);
  save();render();showDeath();
}
function checkTrophies(){
  for(const t of TROPH){if(S.won.includes(t.id))continue;if(t.ok()){
    S.won.push(t.id);let st=0;if(!M.trophies[t.id])st+=3;if(t.id===S.challenge)st+=10;
    M.trophies[t.id]=true;M.stars+=st;S.starsEarned+=st;
    log(`🏆 Trophée débloqué : ${t.t}${st?` (+${st} ★)`:''}`);toast(`🏆 ${t.t}${t.id===S.challenge?' — défi réussi !':''}`+(st?` +${st} ★`:''),[]);
  }}
}

const ico=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${I[n]||''}</svg>`;
const SI={bonheur:'sun',sante:'heart',intel:'bulb',charme:'spark'};
const SC={bonheur:'var(--bon)',sante:'var(--san)',intel:'var(--int)',charme:'var(--cha)',money:'var(--mon)'};
const ACT_UI={etude:['cap','intel','Étudier'],lire:['book','intel','Lire'],sport:['dumbbell','sante','Sport'],jeux:['pad','bonheur','Jouer'],medit:['leaf','bonheur','Méditer'],
 fete:['music','bonheur','Soirée'],benevolat:['gift','charme','Bénévolat'],rencontre:['heart','charme','Rencontre'],medecin:['cross','sante','Médecin'],coach:['drop','charme','Spa'],
 voyage:['plane','bonheur','Voyage'],casino:['dice','money','Casino'],enfant:['baby','bonheur','Bébé']};
const TROPH_I={millionnaire:'coin',centenaire:'clock',docteur:'cross',tribu:'baby',genie:'bulb',icone:'spark',patron:'trend',globe:'plane',zen:'leaf',rentier:'sun',fideles:'ring',licorne:'bolt'};
const REL_C={mère:'#e8458f',père:'#3478f6',fratrie:'#8b5cf6',ami:'#f59e0b',partenaire:'#ff5a36',conjoint:'#ff5a36',enfant:'#17b26a'};

function pills(d){return d.map(([k,v])=>`<span class="dl ${v<0?'neg':''}" style="--c:${SC[k]}">${ico(k==='money'?'coin':SI[k])}${k==='money'?(v>0?'+':'')+fmt(v):(v>0?'+':'−')+Math.abs(v)}</span>`).join('');}
const EMO=/^(\p{Extended_Pictographic}️?)\s*/u;

/* ---------- Affichage ---------- */
function toast(t,d){const el=document.createElement('div');el.className='toast';el.innerHTML=`<div>${esc(t)}</div>${d&&d.length?`<div class="dls">${pills(d)}</div>`:''}`;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),2400);}
function statusLine(){
  if(S.job)return jobTitle(S.job);
  if(S.study)return `${STUDY[S.study.type].t} · ${S.study.left} an${S.study.left>1?'s':''} restant${S.study.left>1?'s':''}`;
  if(S.school)return S.school==='crèche'?'Bébé':`En ${S.school}`;
  if(S.retired)return `Retraité${g('','e')}`;
  return S.age<18?'':'Sans emploi';
}
function render(){
  if(!S){$('#game').hidden=true;renderStart();$('#start').hidden=false;return;}
  $('#start').hidden=true;$('#game').hidden=false;
  $('#g-av').textContent=(S.first[0]||'')+(S.last[0]||'');
  $('#g-name').textContent=`${S.first} ${S.last}`;
  $('#g-sub').textContent=[statusLine(),S.city].filter(Boolean).join(' · ');
  $('#g-age').textContent=S.age;$('#g-agel').textContent=S.age>1?'ans':'an';
  $('#g-menu').innerHTML=ico('dots');
  $('#g-stats').innerHTML=Object.keys(STATS).map(k=>{const v=S.stats[k];return `<button class="ring ${v<25?'low':''}" data-stat="${k}" style="--c:${SC[k]}" aria-label="${STATS[k].n} ${v}"><div class="r"><svg class="g" viewBox="0 0 44 44"><circle class="tr" cx="22" cy="22" r="19"/><circle class="pr" cx="22" cy="22" r="19" pathLength="100" stroke-dasharray="${v} 100"/></svg>${ico(SI[k])}</div><b>${v}</b></button>`;}).join('');
  const mEl=$('#g-money');mEl.innerHTML=ico('coin')+fmt(S.money);mEl.className='money'+(S.money<0?' neg':'');
  const mx=S.age<3?0:S.age<6?2:4;
  $('#g-nrg').innerHTML=mx?Array.from({length:mx},(_,i)=>ico('bolt',i<S.energy?'':'off')).join(''):'<span style="font-size:12px;color:var(--muted);font-weight:600">Bébé</span>';
  const tabs=[['journal','clock','Vie'],['activites','grid','Agir'],['carriere','case','Carrière'],['proches','users','Proches'],['defis','trophy','Défis']];
  $('#g-tabs').innerHTML=tabs.map(([k,i,t])=>`<button data-tab="${k}" class="${TAB===k?'on':''}">${ico(i)}<span>${t}</span><span class="dot"></span></button>`).join('');
  $('#panel').innerHTML=({journal:pJournal,activites:pActs,carriere:pCareer,proches:pRel,defis:pDefis})[TAB]();
  if(S.alive){const ob=OBJ.find(o=>o.id===S.obj);const done=ob&&ob.ok();
    $('#dock').innerHTML=`<button class="objc ${done?'ok':''}" id="d-obj">${ob?`${ico(done?'check':'target')}<span>${esc(ob.t)}</span>`:`${ico('baby')}<span>Grandis encore un peu</span>`}</button><button class="year" id="d-year">+1 an</button>`;}
  else $('#dock').innerHTML='<button class="year" id="m-reborn" style="flex:1">Renaître</button>';
}
function pJournal(){
  const by={};S.log.forEach(e=>{(by[e.a]=by[e.a]||[]).push(e);});
  const ages=Object.keys(by).map(Number).sort((a,b)=>b-a).slice(0,30);
  return ages.map((a,ix)=>`<div class="yr ${ix===0?'now':''}"><div class="yb">${a}</div><div class="ys">${by[a].slice().reverse().map(e=>{
    const m=e.t.match(EMO);const em=m?m[1]:'';const tx=m?e.t.slice(m[0].length):e.t;
    return `<div class="en"><div class="eb">${em||'·'}</div><div class="et"><div>${esc(tx)}</div>${e.d&&e.d.length?`<div class="dls">${pills(e.d)}</div>`:''}</div></div>`;}).join('')}</div></div>`).join('');
}
function pActs(){
  if(S.age<3)return `<div class="empty">${ico('baby')}<div>Tu es encore un bébé.<br>Touche <b>+1 an</b> pour grandir.</div></div>`;
  const list=ACTS.filter(x=>S.age>=x.min&&(!x.max||S.age<=x.max));
  return `<div class="tiles">`+list.map(x=>{const [ic,st,lb]=ACT_UI[x.id];const c=x.cost?x.cost():0;const ok=S.energy>0&&(!x.cond||x.cond())&&(c<=0||S.money>=c);
    return `<button class="tile" data-act="${x.id}" ${ok?'':'disabled'} style="--c:${SC[st]}"><span class="ic">${ico(ic)}</span><span class="l">${lb}</span>${c?`<span class="c">${fmt(c)}</span>`:''}</button>`;}).join('')+`</div><div class="hint">${S.energy?`Chaque action coûte 1 ${'éclair'}`:'Plus d’énergie : passe à l’année suivante'}</div>`;
}
function pCareer(){
  let h='';
  if(S.age<18&&!S.job){h+=`<div class="card"><div class="ch" style="--c:var(--int)"><div class="ic">${ico('cap')}</div><div><div class="tt">${S.school?('En '+S.school):'Petite enfance'}</div><div class="sb">Tu pourras travailler dès 18 ans</div></div></div></div>`;}
  if(S.job){const j=S.job,d=jd(j.id);
    h+=`<div class="card"><div class="ch"><div class="ic">${ico('case')}</div><div style="min-width:0"><div class="tt">${esc(jobTitle(j))}</div><div class="sb">${j.years} an${j.years>1?'s':''} d’ancienneté</div></div></div>
    <div><div class="bign" style="color:var(--mon)">${d.random?(j.lastInc?fmt(j.lastInc):'Variable'):fmt(salary())}</div><div class="sb muted" style="font-size:12px;color:var(--muted)">par an, brut</div></div>
    <div><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px"><span>Performance</span><span>${j.perf}</span></div><div class="bar"><i style="width:${j.perf}%"></i></div></div>
    <div class="acts"><button class="pb go" data-job="bosse" ${S.energy>0?'':'disabled'}>${ico('bolt')}Bosser dur</button><button class="pb" data-job="augm" ${S.talked._augm||d.random?'disabled':''}>${ico('trend')}Augmentation</button><button class="pb warn" data-job="quit">${ico('x')}${CONFIRM==='quit'?'Confirmer':'Démissionner'}</button></div></div>`;
  }else if(S.retired){h+=`<div class="card"><div class="ch" style="--c:var(--bon)"><div class="ic">${ico('sun')}</div><div><div class="tt">À la retraite</div><div class="sb">${fmt(S.pension)} par an</div></div></div></div>`;}
  // études
  if(S.age>=17||S.edu>0||S.study){
    h+=`<div class="card"><div class="ch" style="--c:var(--int)"><div class="ic">${ico('cap')}</div><div><div class="tt">${EDU[S.edu]}</div><div class="sb">${S.study?`${STUDY[S.study.type].t} en cours · ${S.study.left} an${S.study.left>1?'s':''}`:'Ton plus haut diplôme'}</div></div></div>`;
    if(!S.study&&!S.school&&S.age>=19&&!S.retired&&S.age<45){const opts=[];
      if(S.edu===1)opts.push(['licence','Licence · 3 ans']);if(S.edu===2)opts.push(['master','Master · 2 ans']);if(S.edu===3&&S.stats.intel>=65)opts.push(['doctorat','Doctorat · 3 ans']);
      if(S.edu>=1&&S.edu<5&&S.stats.intel>=60&&S.age<30)opts.push(['medecine','Médecine · 9 ans']);
      if(opts.length)h+=`<div class="acts">${opts.map(([k,t])=>`<button class="pb" data-study="${k}">${ico('cap')}${t}</button>`).join('')}</div>`;}
    h+='</div>';
  }
  if(S.age>=18&&!S.retired&&S.age<64&&!S.study&&!(S.school&&S.edu===0)){
    h+=`<div class="sec">Offres d’emploi</div><div class="rows">`+JOBS.filter(d=>!S.job||S.job.id!==d.id).map(d=>{
      const miss=[];if(!eduOK(d.edu))miss.push(EDU[d.edu]);if(S.stats.intel<(d.intel||0))miss.push('Intelligence '+d.intel);if(S.stats.charme<(d.charme||0))miss.push('Charme '+d.charme);
      const tried=S.applied[d.id];const ok=!miss.length&&!tried;
      return `<button class="rw" data-apply="${d.id}" ${ok?'':'disabled'}><div class="x"><b>${S.sex==='f'?d.t[1]:d.t[0]}</b><small>${miss.length?'Il te faut : '+miss.join(', '):tried?'Déjà tenté cette année':'Tu peux postuler'}</small></div><span class="v">${d.random?'Variable':fmt(d.sal)}</span>${ok?ico('chev','lk'):ico('lock','lk')}</button>`;}).join('')+'</div>';
  }
  return h;
}
function initials(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2);}
function pRel(){
  const list=S.rel.filter(r=>!r.ex&&!r.lost);
  if(!list.length)return `<div class="empty">${ico('users')}<div>Personne pour le moment.</div></div>`;
  const order=['conjoint','partenaire','enfant','mère','père','fratrie','ami'];
  list.sort((a,b)=>(b.alive-a.alive)||order.indexOf(a.type)-order.indexOf(b.type));
  return '<div class="rows">'+list.map(r=>{
    const head=`<div class="ph"><div class="pa" style="--c:${REL_C[r.type]||'#888'}">${esc(initials(r.name))}</div><div class="x"><b>${esc(r.name)}</b><small>${relLabel(r)} · ${r.alive?r.age+' ans':'† à '+r.deadAt+' ans'}</small></div>${r.alive?`<span class="hb">${ico('heart')}${r.rel}</span>`:''}</div>`;
    if(!r.alive)return `<div class="pp dead">${head}</div>`;
    const t=S.talked[r.id];const b=[];
    if(S.age>=3)b.push(`<button class="pb" data-rel="temps" data-id="${r.id}" ${t?'disabled':''}>${ico('users')}Voir</button>`);
    if((r.type==='mère'||r.type==='père')&&S.age>=16)b.push(`<button class="pb" data-rel="argent" data-id="${r.id}" ${t?'disabled':''}>${ico('coin')}Argent</button>`);
    if(S.age>=18&&r.type!=='enfant')b.push(`<button class="pb" data-rel="cadeau" data-id="${r.id}" ${t||S.money<200?'disabled':''}>${ico('gift')}Cadeau</button>`);
    if(r.type==='partenaire')b.push(`<button class="pb" data-rel="mariage" data-id="${r.id}" ${t?'disabled':''}>${ico('ring')}Mariage</button>`);
    if(r.type==='partenaire'||r.type==='conjoint')b.push(`<button class="pb warn" data-rel="rompre" data-id="${r.id}">${ico('x')}${CONFIRM==='rompre'+r.id?'Confirmer':(r.type==='conjoint'?'Divorcer':'Rompre')}</button>`);
    return `<div class="pp">${head}<div class="bar" style="--c:var(--cha);height:5px"><i style="width:${r.rel}%"></i></div><div class="acts">${b.join('')}</div></div>`;
  }).join('')+'</div>';
}
function pDefis(){
  const ch=trophyById(S.challenge);let h='';
  if(ch){const done=S.won.includes(ch.id);const pr=Math.max(0,Math.min(1,ch.p()));
    h+=`<div class="card"><div class="ch" style="--c:var(--accent)"><div class="ic">${ico(TROPH_I[ch.id])}</div><div style="flex:1;min-width:0"><div class="sb" style="font-weight:800;color:var(--accent);margin:0 0 2px">DÉFI DE CETTE VIE · +10 ★</div><div class="tt">${ch.t}</div><div class="sb">${ch.d}</div></div></div>${done?`<div style="color:var(--san);font-weight:800">Défi réussi !</div>`:`<div class="bar"><i style="width:${Math.round(pr*100)}%"></i></div>`}</div>`;}
  h+=`<div class="stars"><div><b>${M.stars} ★</b><small>étoiles en banque</small></div><div><b>+${S.starsEarned}</b><small>gagnées cette vie</small></div></div>`;
  h+=`<div class="sec">Trophées</div><div class="badges">`+TROPH.map(t=>{const now=S.won.includes(t.id),ever=M.trophies[t.id];
    return `<button class="bdg ${ever?'got':''} ${t.id===S.challenge?'cur':''}" data-tinfo="${t.id}"><span class="ic">${ico(TROPH_I[t.id])}</span><span class="l">${t.t}</span></button>`;}).join('')+'</div><div class="hint" style="padding-top:10px">Touche un trophée pour voir comment l’obtenir</div>';
  return h;
}

/* ---------- Modale ---------- */
function openModal(html){$('#sheet').innerHTML=html;$('#modal').hidden=false;}
function closeModal(){$('#modal').hidden=true;}
function runQueue(){
  if(!S||!S.alive)return;
  if(!S.queue.length){closeModal();render();return;}
  const e=EV[S.queue[0]];
  if(!e||(e.cond&&!e.cond())){S.queue.shift();return runQueue();}
  const ch=e.c.map((c,i)=>[c,i]).filter(([c])=>!c.cond||c.cond());
  openModal(`<div class="eh"><div class="ei">${e.icon}</div><div><div class="ag">${S.age} an${S.age>1?'s':''}</div><h3>${e.title}</h3></div></div><p>${esc(e.text())}</p><div class="cbs">${ch.map(([c,i])=>`<button class="cb" data-choice="${i}">${esc(c.t)}</button>`).join('')}</div>`);
}
function choose(i){
  const e=EV[S.queue[0]];if(!e)return;
  S.queue.shift();CUR=[];
  const t=e.c[i].f();
  log(e.icon+' '+t,CUR);
  checkTrophies();save();
  openModal(`<div class="eh"><div class="ei">${e.icon}</div><div><div class="ag">${S.age} an${S.age>1?'s':''}</div><h3>${e.title}</h3></div></div><p>${esc(t)}</p>${CUR.length?`<div class="dls">${pills(CUR)}</div>`:''}<button class="next" id="m-next">Continuer</button>`);
}
function showDeath(){
  const job=S.job?jobTitle(S.job):S.retired?'Retraité'+g('','e'):'Aucun';
  openModal(`<div class="eh"><div class="ei">🕯️</div><div><div class="ag">Fin · ${S.age} ans</div><h3>${esc(S.first)} ${esc(S.last)}</h3></div></div><p style="color:var(--muted);font-size:14px">${esc(S.cause)}</p>
   <div><div class="score">${S.score}</div><div style="color:var(--muted);font-size:12px;font-weight:700;margin-top:4px">POINTS${S.score>=M.best?' · NOUVEAU RECORD':` · RECORD ${M.best}`}</div></div>
   <div class="sumg"><div><b>${fmt(S.money)}</b><small>Fortune</small></div><div><b>${esc(job)}</b><small>Métier</small></div><div><b>${S.flags.kids}</b><small>Enfants</small></div><div><b>${S.won.length}</b><small>Trophées</small></div><div><b>${EDU[S.edu]}</b><small>Diplôme</small></div><div><b>+${S.starsEarned} ★</b><small>Étoiles gagnées</small></div></div>
   <button class="next" id="m-reborn" style="background:var(--accent);color:var(--on-accent)">Renaître</button><button class="next" id="m-journal" style="background:var(--surf2);color:var(--fg)">Relire ma vie</button>`);
}

/* ---------- Accueil ---------- */
let ST={sex:'m',attr:'f',challenge:null,perks:[],first:'',last:''};
function rollName(){ST.first=ST.sex==='f'?pick(PF):pick(PM);ST.last=pick(NOMS);}
function renderStart(){
  if(!ST.first)rollName();
  const freeT=TROPH.filter(t=>!M.trophies[t.id]);
  if(!ST.challenge)ST.challenge=(freeT.length?pick(freeT):pick(TROPH)).id;
  const spent=ST.perks.reduce((s,id)=>s+PERKS.find(p=>p.id===id).cost,0);
  const cur=trophyById(ST.challenge);
  $('#start').innerHTML=`<div class="brand"><h1>Re<span>born</span></h1><div class="stars"><div><b>${M.stars-spent} ★</b><small>${M.lives} vie${M.lives>1?'s':''}</small></div></div></div>
  <div class="main">
   <div class="sec">Ton personnage</div>
   <div class="field"><input id="s-first" value="${esc(ST.first)}" aria-label="Prénom"><input id="s-last" value="${esc(ST.last)}" aria-label="Nom"><button class="icb" id="s-roll" aria-label="Nom au hasard" style="width:46px;height:auto">${ico('dice')}</button></div>
   <div class="seg"><button data-sex="m" class="${ST.sex==='m'?'on':''}">Garçon</button><button data-sex="f" class="${ST.sex==='f'?'on':''}">Fille</button></div>
   <div class="sec" style="margin-top:10px">Attiré${ST.sex==='f'?'e':''} par</div><div class="seg"><button data-attr="m" class="${ST.attr==='m'?'on':''}">Les hommes</button><button data-attr="f" class="${ST.attr==='f'?'on':''}">Les femmes</button><button data-attr="both" class="${ST.attr==='both'?'on':''}">Les deux</button></div>
   <div class="sec">Ton défi · +10 ★</div>
   <div class="chs">${TROPH.map(t=>`<button class="bdg ${M.trophies[t.id]?'got':''} ${ST.challenge===t.id?'on':''}" data-ch="${t.id}"><span class="ic">${ico(TROPH_I[t.id])}</span><span class="l">${t.t}</span></button>`).join('')}</div>
   <div class="chd">${cur.d}</div>
   <div class="sec">Atouts de naissance</div>
   <div class="perks">${PERKS.map(p=>{const on=ST.perks.includes(p.id);const can=on||M.stars-spent>=p.cost;return `<button class="perk ${on?'on':''}" data-perk="${p.id}" ${can?'':'disabled'}>${p.t} <em>${p.cost}★</em></button>`;}).join('')}</div>
   <div class="chd">${ST.perks.length?ST.perks.map(id=>PERKS.find(p=>p.id===id).d).join(' · '):M.stars?'Dépense tes étoiles pour partir avec un avantage':'Gagne des étoiles en réussissant tes objectifs'}</div>
  </div>
  <button class="go" id="s-go">Naître</button>`;
}

/* ---------- Interactions ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b||b.disabled)return;
  const d=b.dataset;
  if(d.sex){ST.sex=d.sex;ST.attr=d.sex==='m'?'f':'m';rollName();return renderStart();}
  if(d.attr){ST.attr=d.attr;return renderStart();}
  if(d.ch){ST.challenge=d.ch;return renderStart();}
  if(d.perk){const i=ST.perks.indexOf(d.perk);if(i>=0)ST.perks.splice(i,1);else ST.perks.push(d.perk);return renderStart();}
  if(b.id==='s-roll'){rollName();return renderStart();}
  if(b.id==='s-go'){
    const fi=($('#s-first').value||'').trim()||ST.first, la=($('#s-last').value||'').trim()||ST.last;
    const spent=ST.perks.reduce((s,id)=>s+PERKS.find(p=>p.id===id).cost,0);
    if(spent>M.stars)return;M.stars-=spent;
    newLife({first:fi.slice(0,20),last:la.slice(0,24),sex:ST.sex,attr:ST.attr,challenge:ST.challenge,perks:ST.perks.slice()});
    ST={sex:ST.sex,attr:ST.attr,challenge:null,perks:[],first:'',last:''};TAB='journal';save();render();return;
  }
  if(d.tab){TAB=d.tab;CONFIRM=null;render();$('#panel').scrollTop=0;return;}
  if(d.stat){toast(`${STATS[d.stat].n} : ${S.stats[d.stat]}/100`,[]);return;}
  if(d.tinfo){const t=trophyById(d.tinfo);toast(`${t.t} : ${t.d}`,[]);return;}
  if(b.id==='d-obj'){const ob=OBJ.find(o=>o.id===S.obj);toast(ob?`Objectif de l’année : ${ob.t}. Réussi = +1 ★`:'Les objectifs arrivent à 3 ans',[]);return;}
  if(b.id==='d-year'){ageUp();$('#panel').scrollTop=0;return;}
  if(b.id==='g-menu'){openModal(`<div class="eh"><div class="ei">⚙️</div><div><h3>Options</h3></div></div><p style="font-size:14px;color:var(--muted)">Ta partie est sauvegardée automatiquement sur ce téléphone. Version ${APP_VERSION}.</p><button class="next" id="m-close">Reprendre</button><button class="next" id="m-update" style="background:var(--surf2);color:var(--fg)">Vérifier les mises à jour</button><button class="next" id="m-abandon" style="background:var(--surf2);color:var(--neg)">Abandonner cette vie</button>`);return;}
  if(b.id==='m-close'){closeModal();return;}
  if(b.id==='m-update'){closeModal();checkUpdate(true);return;}
  if(b.id==='m-abandon'){b.id='m-abandon2';b.textContent='Confirmer l’abandon';return;}
  if(b.id==='m-abandon2'){closeModal();S=null;save();render();return;}
  if(d.choice!==undefined){choose(+d.choice);return;}
  if(b.id==='m-next'){if(checkDeath())return;runQueue();return;}
  if(b.id==='m-reborn'){S=null;save();closeModal();render();return;}
  if(b.id==='m-journal'){closeModal();TAB='journal';render();return;}
  if(d.act){const a=ACTS.find(x=>x.id===d.act);if(!a||S.energy<=0)return;S.energy--;CUR=[];const t=a.f();log(t,CUR);toast(t,CUR);after();return;}
  if(d.apply){applyJob(d.apply);return;}
  if(d.study){startStudy(d.study);log(`🎓 Tu reprends des études : ${STUDY[d.study].t}.`);toast('Inscription validée',[]);after();return;}
  if(d.job){jobAction(d.job);return;}
  if(d.rel){relAction(d.rel,d.id);return;}
});
function after(){checkTrophies();save();render();if(S&&S.alive&&S.stats.sante<=0)die('Ta santé a fini par lâcher.');}

function applyJob(id){
  const d=jd(id);S.applied[id]=true;CUR=[];
  let p=d.random?(S.stats.charme-60)/60:.5+(S.stats.intel-(d.intel||0))/120+(S.stats.charme-50)/250;
  if(chance(p)){S.job={id,level:0,perf:50,years:0,yearsLv:0,mult:1,lastInc:0};S.flags.everWorked=true;fx({bonheur:5});const t=`Embauché${g('','e')} ! Tu es maintenant ${jobTitle(S.job)}.`;log('💼 '+t,CUR);toast(t,CUR);}
  else{fx({bonheur:-2});const t=`Candidature refusée pour le poste de ${S.sex==='f'?d.t[1]:d.t[0]}.`;log(t,CUR);toast(t,CUR);}
  after();
}
function jobAction(k){
  const j=S.job;if(!j)return;CUR=[];let t='';
  if(k==='bosse'){if(S.energy<=0)return;S.energy--;S.yr.bosse++;j.perf=clamp(j.perf+R(8,14));fx({bonheur:-1});t='Tu as fait des heures sup. Ton manager a remarqué.';}
  if(k==='augm'){S.talked._augm=true;if(chance(j.perf/130)){j.mult*=1.08;fx({bonheur:3});t='Augmentation de 8 % accordée !';}else{j.perf=clamp(j.perf-5);fx({bonheur:-2});t='Ton patron refuse. Mauvais timing.';}}
  if(k==='quit'){if(CONFIRM!=='quit'){CONFIRM='quit';return render();}CONFIRM=null;t=`Tu quittes ton poste de ${jobTitle(j)}.`;S.job=null;}
  log(t,CUR);toast(t,CUR);after();
}
function relAction(k,id){
  const r=S.rel.find(x=>x.id===id);if(!r)return;CUR=[];let t='';
  if(k==='temps'){S.talked[id]=true;S.yr.social++;r.rel=clamp(r.rel+R(6,12));fx({bonheur:R(1,3)});
    t=pick([`Tu passes un super moment avec ${first(r)}.`,`Longue discussion avec ${first(r)}.`,`${first(r)} et toi riez aux larmes.`]);}
  if(k==='argent'){S.talked[id]=true;if(chance(r.rel/120)){const m=S.perks.includes('rich')?R(2000,8000):R(100,1200);fx({money:m});t=`${first(r)} te donne ${fmt(m)}.`;}else{r.rel=clamp(r.rel-8);t=`${first(r)} refuse et te trouve un peu culotté${g('','e')}.`;}}
  if(k==='cadeau'){S.talked[id]=true;fx({money:-R(80,200)});r.rel=clamp(r.rel+R(10,18));t=`${first(r)} adore ton cadeau.`;}
  if(k==='mariage'){S.talked[id]=true;if(chance(r.rel/110)){t='💍 '+marry();}else{r.rel=clamp(r.rel-15);fx({bonheur:-5});t=`${first(r)} dit qu’il est trop tôt…`;}}
  if(k==='rompre'){if(CONFIRM!=='rompre'+id){CONFIRM='rompre'+id;return render();}CONFIRM=null;t=breakUp(r,`Tu mets fin à ta relation avec ${first(r)}.`);}
  log(t,CUR);toast(t,CUR);after();
}



/* ---------- Mises à jour ---------- */
const APP_VERSION=3;
async function checkUpdate(manual){
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});
    const v=(await r.json()).v;
    if(v>APP_VERSION){
      let tried=null;try{tried=sessionStorage.getItem('rb_try');}catch(e){}
      if(tried==String(v)&&!manual){return;}
      try{sessionStorage.setItem('rb_try',String(v));}catch(e){}
      toast('Mise à jour en cours…',[]);save();
      setTimeout(()=>location.replace(location.pathname+'?v='+v),400);
    }else if(manual)toast(`Tu as la dernière version (v${APP_VERSION})`,[]);
  }catch(e){if(manual)toast('Pas de connexion internet pour vérifier',[]);}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false);});
function boot(data){
  const d=(data&&data.S!==undefined)?data:load();
  if(d){S=d.S||null;if(d.M)M=Object.assign(M,d.M);}
  render();
  if(S&&S.alive&&S.queue&&S.queue.length)runQueue();
  else if(S&&!S.alive)showDeath();
}
boot({});
checkUpdate(false);
</script>
